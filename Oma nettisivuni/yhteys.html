 <div class="container mt-5">
  <h1>Ota yhteyttä</h1>
  <p class="lead">Voit lähettää minulle viestin tällä lomakkeella.</p>

  <form>
    <div class="mb-3">
      <label for="nimi" class="form-label">Nimi</label>
      <input type="text" class="form-control" id="nimi" placeholder="Kirjoita nimesi">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Sähköposti</label>
      <input type="email" class="form-control" id="email" placeholder="esimerkki@gmail.com">
    </div>

    <div class="mb-3">
      <label for="viesti" class="form-label">Viesti</label>
      <textarea class="form-control" id="viesti" rows="4" placeholder="Kirjoita viestisi"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Lähetä</button>
  </form>
</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
